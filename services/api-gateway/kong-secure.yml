_format_version: "3.0"
_transform: true

# Secure Kong Configuration for Eindr Microservices
# Removed wildcard CORS origins and implemented proper security

services:
  - name: auth-service
    url: http://auth-service:8000
    retries: 3
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    routes:
      - name: auth-route
        paths:
          - /auth
        strip_path: false
        preserve_host: false
    plugins:
      - name: cors
        config:
          origins:
            - "http://localhost:3000"
            - "http://localhost:3001" 
            - "http://localhost:8080"
            - "http://localhost:4200"
            - "http://127.0.0.1:3000"
            - "https://yourdomain.com"
            - "https://app.yourdomain.com"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
            - PATCH
          headers:
            - Accept
            - Accept-Version
            - Content-Length
            - Content-MD5
            - Content-Type
            - Date
            - Authorization
            - X-CSRF-Token
            - X-Request-ID
          exposed_headers:
            - X-Auth-Token
            - X-RateLimit-Limit
            - X-RateLimit-Remaining
          credentials: true
          max_age: 3600
      - name: rate-limiting
        config:
          minute: 60
          hour: 600
          policy: local

