version: "3.8"

services:
  # ======================
  # INFRASTRUCTURE
  # ======================
   
  new-postgres-server:
    image: postgres:15
    environment:
      POSTGRES_DB: eindr_db
      POSTGRES_USER: eindr
      POSTGRES_PASSWORD: eindr_pass
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eindr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eindr -d eindr_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - eindr-network
    depends_on:
      - new-postgres-server
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - eindr-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: eindr
      RABBITMQ_DEFAULT_PASS: eindr123
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - eindr-network

  # ======================
  # API GATEWAY WITH KONG
  # ======================
  kong-database:
    image: postgres:15
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kongpass
    volumes:
      - kong_data:/var/lib/postgresql/data
    networks:
      - eindr-network
    ports:
      - "5441:5432"
    restart: unless-stopped

  kong-migration:
    image: kong:3.4
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_PORT: 5432
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpass
    networks:
      - eindr-network
    depends_on:
      - kong-database
    restart: on-failure

  kong:
    image: kong:3.4
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_PORT: 5432
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpass
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
      KONG_PLUGINS: bundled,jwt,cors,rate-limiting,request-transformer,response-transformer,correlation-id,file-log
    ports:
      - "8080:8000" # Main API Gateway port
      - "8443:8443" # Proxy SSL port
      - "8101:8001" # Admin API port (changed to avoid conflict with auth-service)
      - "8444:8444" # Admin API SSL port
      - "8102:8002" # Admin GUI port (changed to avoid conflict)
    networks:
      - eindr-network
    depends_on:
      - kong-migration
      - auth-service
      - customer-service
      - reminder-service
      - note-service
      - ledger-service
      - friend-service
      - history-service
      - stt-service
      - tts-service
      - intent-service
      - chat-service
      - scheduler-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 30s
      timeout: 30s
      retries: 3

  konga:
    image: pantsel/konga:latest
    environment:
      NODE_ENV: production
      KONGA_HOOK_TIMEOUT: 120000
    ports:
      - "8103:1337" # Changed to keep Kong-related services in 81xx range
    networks:
      - eindr-network
    depends_on:
      - kong
    restart: unless-stopped

  # ======================
  # MICROSERVICES
  # ======================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://eindr:eindr_pass@new-postgres-server:5432/eindr_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: eindr-super-secret-key-change-in-production-123456789
      SERVICE_NAME: auth-service
      PORT: 8000
    ports:
      - "8001:8000"
    volumes:
      - ./services/auth-service:/app
    networks:
      - eindr-network
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 20s
      retries: 3

  customer-service:
    build:
      context: ./services/customer-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://eindr:eindr_pass@new-postgres-server:5432/eindr_db
      AUTH_SERVICE_URL: http://auth-service:8000
      RABBITMQ_URL: amqp://eindr:eindr123@rabbitmq:5672/
      SERVICE_NAME: customer-service
      PORT: 8000
    ports:
      - "8002:8000"
    volumes:
      - ./services/customer-service:/app
    networks:
      - eindr-network
    depends_on:
      - rabbitmq
      - auth-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 20s
      retries: 3

  reminder-service:
    build:
      context: ./services/reminder-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://eindr:eindr_pass@new-postgres-server:5432/eindr_db
      AUTH_SERVICE_URL: http://auth-service:8000
      RABBITMQ_URL: amqp://eindr:eindr123@rabbitmq:5672/
      SERVICE_NAME: reminder-service
      PORT: 8000
    ports:
      - "8003:8000"
    volumes:
      - ./services/reminder-service:/app
    networks:
      - eindr-network
    depends_on:
      - rabbitmq
      - auth-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  note-service:
    build:
      context: ./services/note-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://eindr:eindr_pass@new-postgres-server:5432/eindr_db
      AUTH_SERVICE_URL: http://auth-service:8000
      RABBITMQ_URL: amqp://eindr:eindr123@rabbitmq:5672/
      SERVICE_NAME: note-service
      PORT: 8000
    ports:
      - "8004:8000"
    volumes:
      - ./services/note-service:/app
    networks:
      - eindr-network
    depends_on:
      - rabbitmq
      - auth-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ledger-service:
    build:
      context: ./services/ledger-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://eindr:eindr_pass@new-postgres-server:5432/eindr_db
      AUTH_SERVICE_URL: http://auth-service:8000
      RABBITMQ_URL: amqp://eindr:eindr123@rabbitmq:5672/
      SERVICE_NAME: ledger-service
      PORT: 8000
    ports:
      - "8005:8000"
    volumes:
      - ./services/ledger-service:/app
    networks:
      - eindr-network
    depends_on:
      - rabbitmq
      - auth-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  friend-service:
    build:
      context: ./services/friend-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://eindr:eindr_pass@new-postgres-server:5432/eindr_db
      AUTH_SERVICE_URL: http://auth-service:8000
      RABBITMQ_URL: amqp://eindr:eindr123@rabbitmq:5672/
      SERVICE_NAME: friend-service
      PORT: 8000
    ports:
      - "8006:8000"
    volumes:
      - ./services/friend-service:/app
    networks:
      - eindr-network
    depends_on:
      - rabbitmq
      - auth-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  history-service:
    build:
      context: ./services/history-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://eindr:eindr_pass@new-postgres-server:5432/eindr_db
      AUTH_SERVICE_URL: http://auth-service:8000
      RABBITMQ_URL: amqp://eindr:eindr123@rabbitmq:5672/
      SERVICE_NAME: history-service
      PORT: 8000
    ports:
      - "8007:8000"
    volumes:
      - ./services/history-service:/app
    networks:
      - eindr-network
    depends_on:
      - rabbitmq
      - auth-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  stt-service:
    build:
      context: ./services/stt-service
      dockerfile: Dockerfile
    environment:
      MODEL_PATH: /app/models
      AUTH_SERVICE_URL: http://auth-service:8000
      RABBITMQ_URL: amqp://eindr:eindr123@rabbitmq:5672/
      SERVICE_NAME: stt-service
      PORT: 8000
    ports:
      - "8008:8000"
    volumes:
      - ./services/stt-service:/app
      - ./models:/app/models:ro
    networks:
      - eindr-network
    depends_on:
      - rabbitmq
      - auth-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  tts-service:
    build:
      context: ./services/tts-service
      dockerfile: Dockerfile
    environment:
      MODEL_PATH: /app/models
      AUTH_SERVICE_URL: http://auth-service:8000
      RABBITMQ_URL: amqp://eindr:eindr123@rabbitmq:5672/
      SERVICE_NAME: tts-service
      PORT: 8000
    ports:
      - "8009:8000"
    volumes:
      - ./services/tts-service:/app
      - ./models:/app/models:ro
    networks:
      - eindr-network
    depends_on:
      - rabbitmq
      - auth-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  intent-service:
    build:
      context: ./services/intent-service
      dockerfile: Dockerfile
    environment:
      MODEL_PATH: /app/models
      AUTH_SERVICE_URL: http://auth-service:8000
      RABBITMQ_URL: amqp://eindr:eindr123@rabbitmq:5672/
      SERVICE_NAME: intent-service
      PORT: 8000
    ports:
      - "8010:8000"
    volumes:
      - ./services/intent-service:/app
      - ./models:/app/models:ro
    networks:
      - eindr-network
    depends_on:
      - rabbitmq
      - auth-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  chat-service:
    build:
      context: ./services/chat-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://eindr:eindr_pass@new-postgres-server:5432/eindr_db
      MODEL_PATH: /app/models
      AUTH_SERVICE_URL: http://auth-service:8000
      RABBITMQ_URL: amqp://eindr:eindr123@rabbitmq:5672/
      SERVICE_NAME: chat-service
      PORT: 8000
    ports:
      - "8011:8000"
    volumes:
      - ./services/chat-service:/app
      - ./models:/app/models:ro
    networks:
      - eindr-network
    depends_on:
      - rabbitmq
      - auth-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  scheduler-service:
    build:
      context: ./services/scheduler-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://eindr:eindr_pass@new-postgres-server:5432/eindr_db
      RABBITMQ_URL: amqp://eindr:eindr123@rabbitmq:5672/
      REMINDER_SERVICE_URL: http://reminder-service:8000
      AUTH_SERVICE_URL: http://auth-service:8000
      SERVICE_NAME: scheduler-service
      PORT: 8000
    ports:
      - "8012:8000"
    volumes:
      - ./services/scheduler-service:/app
    networks:
      - eindr-network
    depends_on:
      - rabbitmq
      - reminder-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ai-pipeline-service:
    build:
      context: ./services/ai-pipeline-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://eindr:eindr_pass@new-postgres-server:5432/eindr_db
      SERVICE_NAME: ai-pipeline-service
      PORT: 8000
      STT_SERVICE_URL: http://localhost:8008
      INTENT_SERVICE_URL: http://localhost:8010
      CHAT_SERVICE_URL: http://localhost:8011
      TTS_SERVICE_URL: http://localhost:8009
      AI_HTTP_TIMEOUT: '30'
    ports:
      - "8081:8000"
    volumes:
      - ./services/ai-pipeline-service:/app
    networks:
      - eindr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ======================
  # MONITORING & OBSERVABILITY
  # ======================
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - eindr-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - eindr-network
    depends_on:
      - prometheus

volumes:
  eindr_shared_db:
  kong_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  postgres_data:
  pgadmin_data:

networks:
  eindr-network:
    driver: bridge
