apiVersion: 1

providers:
  - name: "eindr-dashboards"
    orgId: 1
    folder: "Eindr Microservices"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards


