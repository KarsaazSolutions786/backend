global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Eindr Microservices
  - job_name: "auth-service"
    static_configs:
      - targets: ["auth-service:8000"]
    metrics_path: "/metrics"
    scrape_interval: 30s

  - job_name: "user-service"
    static_configs:
      - targets: ["user-service:8000"]
    metrics_path: "/metrics"
    scrape_interval: 30s

  - job_name: "reminder-service"
    static_configs:
      - targets: ["reminder-service:8000"]
    metrics_path: "/metrics"
    scrape_interval: 30s

  - job_name: "note-service"
    static_configs:
      - targets: ["note-service:8000"]
    metrics_path: "/metrics"
    scrape_interval: 30s

  - job_name: "ledger-service"
    static_configs:
      - targets: ["ledger-service:8000"]
    metrics_path: "/metrics"
    scrape_interval: 30s

  - job_name: "friend-service"
    static_configs:
      - targets: ["friend-service:8000"]
    metrics_path: "/metrics"
    scrape_interval: 30s

  - job_name: "history-service"
    static_configs:
      - targets: ["history-service:8000"]
    metrics_path: "/metrics"
    scrape_interval: 30s

  - job_name: "chat-service"
    static_configs:
      - targets: ["chat-service:8000"]
    metrics_path: "/metrics"
    scrape_interval: 30s

  - job_name: "scheduler-service"
    static_configs:
      - targets: ["scheduler-service:8000"]
    metrics_path: "/metrics"
    scrape_interval: 30s

  # AI Services (more frequent monitoring)
  - job_name: "stt-service"
    static_configs:
      - targets: ["stt-service:8000"]
    metrics_path: "/metrics"
    scrape_interval: 15s

  - job_name: "tts-service"
    static_configs:
      - targets: ["tts-service:8000"]
    metrics_path: "/metrics"
    scrape_interval: 15s

  - job_name: "intent-service"
    static_configs:
      - targets: ["intent-service:8000"]
    metrics_path: "/metrics"
    scrape_interval: 15s

  # Infrastructure Services
  - job_name: "kong-gateway"
    static_configs:
      - targets: ["kong:8001"]
    metrics_path: "/metrics"
    scrape_interval: 30s

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
    scrape_interval: 30s

  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]
    metrics_path: "/metrics"
    scrape_interval: 30s

  # Database monitoring (if metrics exporters are configured)
  - job_name: "postgres-exporters"
    static_configs:
      - targets: [] # Add postgres_exporter targets if configured
    scrape_interval: 30s

  scrape_interval: 15s
  evaluation_interval: 15s

